name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # A syntax check passes on code that cannot run. Importing the factory
      # is the minimum bar for reporting the backend as healthy.
      - name: Verify application factory
        run: python -c "from app import create_app; create_app('testing')"

      - name: Run tests
        run: pytest -q

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The deployed database is PostgreSQL; the fast suite runs on SQLite.
    # That difference is not cosmetic. SQLite serialises writes, so it
    # cannot express a lost update, and two concurrency defects reached
    # main because the suite was structurally unable to fail. This job
    # exists to close that gap, and also covers what SQLite does not
    # model at all: schema isolation, server-side defaults, and the
    # stricter type and constraint behaviour.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve
          POSTGRES_DB: resolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # gen_random_uuid() is used by the concurrency tests to insert rows
      # directly. Built in from PostgreSQL 13, but the extension makes the
      # requirement explicit rather than assumed.
      - name: Prepare the database
        env:
          PGPASSWORD: resolve
        run: psql -h localhost -U resolve -d resolve_test -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

      # Migrations are what actually runs against a deployment. Running
      # them here catches a revision that works on SQLite and fails on
      # PostgreSQL, which create_all() would never reveal.
      - name: Apply migrations
        env:
          FLASK_APP: run.py
          DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_test
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade

      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_test
        run: pytest -q

      # The same suite in a dedicated schema, which is how it is deployed
      # into the shared Supabase project. A revision that hardcodes
      # schema=None passes everywhere else and breaks only here.
      - name: Run tests in an isolated schema
        env:
          TEST_DATABASE_URL: postgresql://resolve:resolve@localhost:5432/resolve_test
          DB_SCHEMA: resolve
        run: pytest -q

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the API
        working-directory: backend
        env:
          FLASK_APP: run.py
          # The suite signs in repeatedly against a throwaway database, so
          # the login limit would reject it. Never set on a deployment.
          RATELIMIT_ENABLED: 'false'
        run: |
          flask seed --demo
          nohup python run.py > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/api/ready && break
            sleep 1
          done

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser journeys
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked in git."
            exit 1
          fi
          if git ls-files | grep -E '\.pyc$'; then
            echo "Compiled Python artefacts are tracked in git."
            exit 1
          fi
