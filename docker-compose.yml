# Production-shaped stack.
#
# Brings up the dependencies the application refuses to run without:
# PostgreSQL for data, Redis for rate limit counters shared across workers,
# and a volume for uploads that survives a redeploy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-resolve}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Backups are written here by the backup service below.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolve}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate limit counters only. Losing them on restart costs nothing, so
    # persistence is off deliberately.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE: ${RELEASE:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolve}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resolve}
      # Shared storage, so the login limit is not multiplied by the worker
      # count. Production refuses to start without this.
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://resolve.ng}
      APP_URL: ${APP_URL:-https://resolve.ng}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@resolve.ng}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-5000}:5000"

  # Scheduled work. Separate from the web process so a long purge cannot
  # occupy a request worker.
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-resolve}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resolve}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      WEB_CONCURRENCY: "1"
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@resolve.ng}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    # Escalation every 30 minutes, delivery every 5, purge and the ignored
    # report once a day. The report enforces its own weekly interval.
    command: >
      sh -c 'while true; do
        flask send-queue || true;
        [ $$(( $$(date +%s) / 1800 % 1 )) -eq 0 ] && flask escalate || true;
        [ "$$(date +%H%M)" = "0200" ] && flask purge-expired || true;
        [ "$$(date +%H%M)" = "0700" ] && flask report-ignored || true;
        sleep 300;
      done'

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # A dump a day, keeping fourteen. Restoring one is a documented drill,
    # not an assumption: see docs/OPERATIONS.md.
    command: >
      sh -c 'while true; do
        pg_dump -h db -U ${POSTGRES_USER:-resolve} -d ${POSTGRES_DB:-resolve}
          | gzip > /backups/resolve-$$(date +%%Y%%m%%d-%%H%%M).sql.gz;
        find /backups -name "resolve-*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  db_data:
  uploads:
